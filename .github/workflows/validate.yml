name: Validate publication source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/publish.py build
      - run: python scripts/publish.py validate
      - run: python scripts/test-publication.py
      - run: node scripts/test-paypal.mjs
